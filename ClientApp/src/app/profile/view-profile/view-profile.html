<div class="profile-page" *ngIf="user; else loading">

  <div class="profile-avatar">
    <img
      *ngIf="user.profilePhoto; else fallback"
      [src]="user.profilePhoto"
      class="avatar-img"
    />

    <ng-template #fallback>
      <div class="avatar-placeholder">
        {{ initial }}
      </div>
    </ng-template>
  </div>

  <h2>{{ user.userName }}</h2>
  <p>{{ user.email }}</p>

  <button class="logout-btn" (click)="logout()">🚪 Logout</button>
</div>

<ng-template #loading>
  <div class="profile-loading">Loading profile…</div>
</ng-template>
