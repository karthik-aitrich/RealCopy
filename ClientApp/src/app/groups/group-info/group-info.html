<div class="group-info">

  <!-- HEADER -->
  <h3 class="title">Group Members</h3>

  <!-- MEMBERS LIST -->
  <div class="member-list">
    <div class="member-card" *ngFor="let m of members">

      <div class="left">
        <div class="avatar">
          {{ m.userName?.[0] || '?' }}
        </div>

        <div class="details">
          <div class="name">
            {{ m.userName }}
            <span class="admin-badge" *ngIf="m.role === 1">
              Admin
            </span>
          </div>
        </div>
      </div>

      <div class="actions" *ngIf="m.userId !== myId">
        <button
          class="btn admin"
          *ngIf="m.role === 0"
          (click)="changeRole(m.userId, 1)">
          Make Admin
        </button>

        <button
          class="btn remove"
          (click)="remove(m.userId)">
          Remove
        </button>
      </div>

    </div>
  </div>

  <!-- ADD MEMBERS (ADMIN ONLY) -->
  <div class="add-member-wrapper" *ngIf="isAdmin">

    <!-- SINGLE CONTROL BUTTON -->
    <button
      class="add-member-btn"
      [class.open]="showAddMembers"
      (click)="toggleAddMembers()">
      <span class="icon">+</span>
      {{ showAddMembers ? 'Cancel' : 'Add Members' }}
    </button>

    <!-- PANEL -->
    <div class="add-member-panel" *ngIf="showAddMembers">

      <div class="add-member-list">
        <div
          class="add-user"
          *ngFor="let u of addableUsers"
          (click)="toggleSelect(u.userId)"
          [class.selected]="selectedUserIds.includes(u.userId)"
        >
          <div class="avatar small">
            {{ u.userName?.[0] || '?' }}
          </div>
          <span>{{ u.userName }}</span>
        </div>
      </div>

      <button
        class="confirm-add-btn"
        [disabled]="selectedUserIds.length === 0"
        (click)="addMembers()">
        Add Selected
      </button>

    </div>
  </div>

  <!-- LEAVE GROUP -->
  <div class="leave-section">
    <button class="leave-btn" (click)="leave()">
      Leave Group
    </button>
  </div>

</div>
