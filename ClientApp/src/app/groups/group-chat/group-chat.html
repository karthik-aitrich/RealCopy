<div class="chat-window group-chat user-chat">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="header-left">
      <div class="name">{{ groupName }}</div>
      <div class="status">{{ membersCount }} members</div>
    </div>

    <button class="info-btn" (click)="openGroupInfo()">ℹ</button>
  </div>

  <!-- BODY -->
  <div #chatBody class="chat-body">

    <div *ngIf="isLoading" class="loading">Loading...</div>

    <div *ngFor="let msg of messages; trackBy: trackByMessage"
         class="message-row"
         [ngClass]="isMine(msg) ? 'me' : 'other'">

      <div class="bubble">
        <!-- 🔥 DEBUG (ADD THIS) -->
    <!-- <div style="color:red; font-size:10px;">
      msg: {{ msg.senderId }} <br>
      me: {{ senderId }}
    </div> -->
        <!-- OPTIONS -->
        <div class="options"
             *ngIf="isMine(msg) && (msg.messageId || msg.clientTempId)">

          <button class="dots"
                  (click)="toggleMenu(getMenuKey(msg)); $event.stopPropagation()">
            ⋮
          </button>

          <div class="menu"
               *ngIf="activeMenuId === getMenuKey(msg)">

            <div class="menu-item"
                 (click)="deleteMessage(msg)">
              Delete
            </div>

          </div>
        </div>

        <!-- SENDER -->
        <div *ngIf="msg.senderId !== senderId"
             class="sender-name">
          {{ msg.senderName }}
        </div>

        <!-- TEXT -->
        <div class="text"
             [ngClass]="{ deleted: msg.isDeleted }">

          {{ msg.isDeleted
              ? 'This message was deleted'
              : msg.messageText }}

        </div>

        <!-- META -->
        <div class="meta">
          {{ msg.sentAt | date:'shortTime' }}
        </div>

      </div>
    </div>

  </div>
<div class="not-member" *ngIf="!isMember">
  You are not a member of this group.
</div>
 <!-- INPUT -->
<div class="chat-input">

  <input
    [(ngModel)]="message"
    placeholder="Type a message..."
    [disabled]="!isMember"
    (keydown.enter)="$event.preventDefault(); send()"
  />

  <button
    type="button"
    (click)="send()"
    [disabled]="!isMember">
    ➤
  </button>

</div>

</div>
