<div class="chat-window group-chat user-chat">

  <!-- HEADER -->
  <div class="chat-header">

    <div class="header-left">
      <div class="name">{{ groupName }}</div>
      <div class="status">{{ membersCount }} members</div>
    </div>

    <div class="header-actions">
      <button class="clear-btn" (click)="clearChat()">
        Clear Chat
      </button>

      <button class="info-btn" (click)="openGroupInfo()">
        ℹ
      </button>
    </div>

  </div>

  <!-- BODY -->
  <div #chatBody class="chat-body">

    <div *ngIf="isLoading" class="loading">
      Loading...
    </div>

    <div *ngFor="let msg of messages; trackBy: trackByMessage"
         class="message-row"
         [class.me]="isMine(msg)"
         [class.other]="!isMine(msg)">

      <div class="bubble">

        <!-- OPTIONS -->
        <div class="options"
             *ngIf="isMine(msg) && (msg.status ?? 0) !== 1 && (msg.messageId || msg.clientTempId)">

          <button class="dots"
                  (click)="toggleMenu(getMenuKey(msg)); $event.stopPropagation()">
            ⋮
          </button>

          <div class="menu"
               *ngIf="activeMenuId === getMenuKey(msg)">

            <div class="menu-item"
                 (click)="deleteMessage(msg)">
              Delete
            </div>

          </div>
        </div>

        <!-- SENDER NAME -->
        <div *ngIf="!isMine(msg)" class="sender-name">
          {{ msg.senderName || 'Unknown' }}
        </div>

        <!-- MESSAGE -->
        <div class="text"
             [class.deleted]="(msg.status ?? 0) === 1">

          <ng-container *ngIf="(msg.status ?? 0) === 1; else normalMsg">
            This message was deleted
          </ng-container>

          <ng-template #normalMsg>
            {{ msg.messageText }}
          </ng-template>

        </div>

        <!-- META -->
        <div class="meta">
          {{ msg.sentAt | date:'shortTime' }}
        </div>

      </div>

    </div>

  </div>

  <!-- INPUT -->
  <div class="chat-input">

    <input
      [(ngModel)]="message"
      placeholder="Type a message..."
      (keydown.enter)="$event.preventDefault(); send()"
    />

    <button type="button" (click)="send()">
      ➤
    </button>

  </div>

</div>
