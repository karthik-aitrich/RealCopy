<div class="auth-page">

  <!-- LEFT BRAND -->
  <div class="auth-brand">
    <img src="assets/logo.jpeg" alt="Chatz logo" />
    <h1>Chatz</h1>
    <p>Verify your identity</p>
  </div>

  <!-- RIGHT FORM -->
  <div class="auth-card">
<button
  class="back-arrow"
  type="button"
  (click)="goBack()"
  aria-label="Back to Register">
  ←
</button>

    <h2>Verify OTP</h2>
    <span class="subtitle">
      OTP sent to <b>{{ email }}</b>
    </span>

    <!-- ⚠️ ERROR MESSAGE -->
    <p class="error-text" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

   <input
  type="text"
  placeholder="Enter 6-digit OTP"
  [(ngModel)]="otp"
  maxlength="6"
  inputmode="numeric"
/>


    <button
      class="auth-btn"
      (click)="verifyOtp()"
      [disabled]="!otp">
      Verify
    </button>
    
    

    <div class="otp-actions">

 <p class="footer-text">
  Didn’t receive the code?
  <span
    class="auth-link"
    [class.disabled]="resendDisabled"
    (click)="!resendDisabled && resendOtp()">
    Resend OTP
  </span>

  <span *ngIf="resendDisabled">
    ({{ resendTimer }}s)
  </span>
</p>


  <!-- <button
    class="back-btn"
    type="button"
    (click)="goBack()">
    ← Back to Register
  </button> -->

</div>




    <!-- <p class="footer-text">
      Didn’t receive the code?
      <a (click)="resendOtp()">Resend OTP</a>
    </p> -->

  </div>

</div>
