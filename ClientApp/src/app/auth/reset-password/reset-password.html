<div class="auth-page">

  <!-- BRAND (same) -->
  <div class="auth-brand">
    <img src="assets/logo.jpeg" alt="Chatz logo">
    <h1>Chatz</h1>
    <p>Connect. Chat. Chill.</p>
  </div>

  <!-- CARD -->
  <div class="auth-card">

    <h2>Forgot Password</h2>
    <span class="subtitle">
      Enter your email to receive a reset link
    </span>

    <p class="error-text" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <p class="success-text" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <input
      type="email"
      [(ngModel)]="email"
      placeholder="Email address"
    />

    <button
      class="auth-btn"
      (click)="submit()"
      [disabled]="isSubmitting || !email">
      {{ isSubmitting ? 'Sending…' : 'Send Reset Link' }}
    </button>

     <div class="auth-links single">
  <a routerLink="/login">← Back to Login</a>
</div>


  </div>

</div>
