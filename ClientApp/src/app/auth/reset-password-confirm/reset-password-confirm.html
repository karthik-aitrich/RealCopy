<div class="auth-page">

  <div class="auth-brand">
    <img src="assets/logo.jpeg" alt="Chatz logo">
    <h1>Chatz</h1>
    <p>Connect. Chat. Chill.</p>
  </div>

  <div class="auth-card">
    

    <h2>Reset Password</h2>
    <span class="subtitle">
      Enter a new password for your account
    </span>

    <p class="error-text" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <p class="success-text" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <input
      type="password"
      placeholder="New password"
      [(ngModel)]="newPassword"
    />

    <input
      type="password"
      placeholder="Confirm password"
      [(ngModel)]="confirmPassword"
    />

    <button
      class="auth-btn"
      (click)="submit()"
      [disabled]="isSubmitting || !newPassword || !confirmPassword">
      {{ isSubmitting ? 'Updating…' : 'Reset Password' }}
    </button>

    <p class="footer-text">
      <a routerLink="/login">← Back to Login</a>
    </p>

  </div>
</div>
